[project]
name = "absolute_date_time"
authors = [
    { name = "Fibersoft", email = "info@fibersoft.online" }
]
description = "Shows the exact date and time in the Activity section of every document"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=14.0.0,<17.0.0"
